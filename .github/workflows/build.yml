name: build

on:
  workflow_dispatch:   # <- adiciona isso pra poder disparar manual, sem precisar de PR

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [ x86_64 ]   # <- só a que você precisa, corta o resto
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: gh-cache/
          key: "prefix-${{ hashFiles('buildscripts/**.sh') }}"
          restore-keys: "prefix-"
          enableCrossOsArchive: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build python3-pip gperf
          sudo pip3 install meson

      - name: Download deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build the release artifacts
        run: |
          set -x
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./download.sh > /dev/null
          ./buildall.sh --arch x86_64 mpv
          ./buildall.sh -n

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-apk
          path: app/build/output/app-debug.apk  # <- ADICIONADO: pega o APK instalável
